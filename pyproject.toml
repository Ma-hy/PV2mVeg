[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv2mveg"
version = "2.0"
description = "Inter-row vegetation greenness of solar-park arrays from sub-metre satellite imagery: code and derived data of the manuscript (v2.0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders figures (minutes)"]
